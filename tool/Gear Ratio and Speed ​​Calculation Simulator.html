<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ギヤ比・速度計算シミュレーター</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #0f172a;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 15px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid #e2e8f0;
            color: #475569;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 8px;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .tire-info {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        @media (min-width: 640px) {
            button {
                width: auto;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ギヤ比・速度シミュレーター</h1>

    <div class="card">
        <form id="calcForm" onsubmit="event.preventDefault(); calculate();">
            
            <div class="section-title">タイヤ・ホイール仕様</div>
            <div class="grid-container">
                <div class="input-group">
                    <label for="wheelInch">ホイール直径 (インチ)</label>
                    <input type="number" id="wheelInch" step="0.1" value="13" required>
                </div>
                <div class="input-group">
                    <label for="tireWidth">タイヤ幅 (mm)</label>
                    <input type="number" id="tireWidth" step="1" value="185" required>
                </div>
                <div class="input-group">
                    <label for="tireFlat">扁平率 (%)</label>
                    <input type="number" id="tireFlat" step="1" value="60" required>
                </div>
            </div>
            <div id="tireOuterDia" class="tire-info">計算外径: -</div>

            <div class="section-title">ファイナルギヤ & 最終減速</div>
            <div class="grid-container">
                <div class="input-group">
                    <label for="finalGear">ファイナルギヤレシオ</label>
                    <input type="number" id="finalGear" step="0.001" value="4.300" required>
                </div>
            </div>

            <div class="section-title">ミッションギヤレシオ (1速〜6速)</div>
            <div class="grid-container">
                <div class="input-group">
                    <label for="gear1">1速</label>
                    <input type="number" id="gear1" step="0.001" value="3.587" required>
                </div>
                <div class="input-group">
                    <label for="gear2">2速</label>
                    <input type="number" id="gear2" step="0.001" value="2.022" required>
                </div>
                <div class="input-group">
                    <label for="gear3">3速</label>
                    <input type="number" id="gear3" step="0.001" value="1.384" required>
                </div>
                <div class="input-group">
                    <label for="gear4">4速</label>
                    <input type="number" id="gear4" step="0.001" value="1.000" required>
                </div>
                <div class="input-group">
                    <label for="gear5">5速</label>
                    <input type="number" id="gear5" step="0.001" value="0.861" required>
                </div>
                <div class="input-group">
                    <label for="gear6">6速</label>
                    <input type="number" id="gear6" step="0.001" value="0.750" required>
                </div>
            </div>

            <div class="btn-container">
                <button type="button" onclick="calculate()">計算する</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="section-title">速度一覧 (km/h)</div>
        <div class="table-responsive">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>回転数 (rpm)</th>
                        <th>1速</th>
                        <th>2速</th>
                        <th>3速</th>
                        <th>4速</th>
                        <th>5速</th>
                        <th>6速</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JavaScriptで動的生成 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function calculate() {
    // 入力値の取得
    const wheelInch = parseFloat(document.getElementById('wheelInch').value);
    const tireWidth = parseFloat(document.getElementById('tireWidth').value);
    const tireFlat = parseFloat(document.getElementById('tireFlat').value);
    const finalGear = parseFloat(document.getElementById('finalGear').value);

    const gears = [
        parseFloat(document.getElementById('gear1').value),
        parseFloat(document.getElementById('gear2').value),
        parseFloat(document.getElementById('gear3').value),
        parseFloat(document.getElementById('gear4').value),
        parseFloat(document.getElementById('gear5').value),
        parseFloat(document.getElementById('gear6').value)
    ];

    // タイヤ外径の計算 (mm)
    // 外径 = (ホイールインチ * 25.4) + (タイヤ幅 * 扁平率 / 100 * 2)
    const wheelMm = wheelInch * 25.4;
    const sidewallMm = tireWidth * (tireFlat / 100) * 2;
    const outerDiameterMm = wheelMm + sidewallMm;
    const outerDiameterM = outerDiameterMm / 1000;

    // タイヤ外周長 (m)
    const circumferenceM = outerDiameterM * Math.PI;

    // 外径情報を表示
    document.getElementById('tireOuterDia').innerText = 
        `計算タイヤ外径: ${outerDiameterMm.toFixed(1)} mm (周長: ${(circumferenceM * 1000).toFixed(1)} mm)`;

    // 表示する回転数リスト (1000rpm 〜 9000rpm、1000刻み)
    const rpms = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000];

    const tbody = document.querySelector('#resultTable tbody');
    tbody.innerHTML = '';

    rpms.forEach(rpm => {
        const row = document.createElement('tr');
        
        // 回転数セル
        const rpmCell = document.createElement('td');
        rpmCell.style.fontWeight = '600';
        rpmCell.innerText = rpm.toLocaleString() + ' rpm';
        row.appendChild(rpmCell);

        // 各ギヤの速度計算
        // 速度 (km/h) = (エンジン回転数 * タイヤ外周長(m) * 60) / (ミッションギヤ比 * ファイナルギヤ比 * 1000)
        gears.forEach(gearRatio => {
            const speedCell = document.createElement('td');
            if (gearRatio > 0 && finalGear > 0) {
                const speed = (rpm * circumferenceM * 60) / (gearRatio * finalGear * 1000);
                speedCell.innerText = speed.toFixed(1);
            } else {
                speedCell.innerText = '-';
            }
            row.appendChild(speedCell);
        });

        tbody.appendChild(row);
    });
}

// ページ読み込み時に自動計算を実行
window.onload = calculate;
</script>

</body>
</html>
